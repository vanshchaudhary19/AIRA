<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIRA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f5f5f7;
    color: #1d1d1f;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid #e5e5ea;
  }

  .logo { display: flex; align-items: center; gap: 12px; }

  .logo-icon {
    width: 36px; height: 36px;
    background: #1d1d1f;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  .logo h1 {
    font-size: 18px; font-weight: 700;
    letter-spacing: 2px; color: #1d1d1f;
  }

  .logo span {
    font-size: 11px; color: #86868b;
    letter-spacing: 0.5px;
  }

  .header-right { display: flex; align-items: center; gap: 12px; }

  .status-pill {
    display: flex; align-items: center; gap: 7px;
    background: #f5f5f7;
    border: 1px solid #e5e5ea;
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 12px; color: #86868b;
  }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #86868b;
    transition: background 0.3s;
  }
  .status-dot.active { background: #34c759; box-shadow: 0 0 6px #34c759; }

  .btn {
    padding: 8px 20px;
    border-radius: 20px;
    border: none;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }

  .btn-start {
    background: #1d1d1f; color: #fff;
  }
  .btn-start:hover { background: #3a3a3c; }

  .btn-stop {
    background: #ff3b30; color: #fff;
    display: none;
  }
  .btn-stop:hover { background: #d70015; }

  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 300px;
    overflow: hidden;
  }

  /* ── feed ── */
  .feed-section {
    position: relative;
    background: #000;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }

  .feed-section img {
    width: 100%; height: 100%;
    object-fit: cover;
  }

  .feed-placeholder {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; color: #86868b; font-size: 14px;
  }
  .feed-placeholder .icon { font-size: 48px; opacity: 0.3; }

  .obj-badge {
    position: absolute; top: 14px; left: 14px;
    background: rgba(255,255,255,0.9);
    border: 1px solid #e5e5ea;
    border-radius: 8px; padding: 4px 10px;
    font-size: 11px; color: #1d1d1f;
    font-weight: 500; backdrop-filter: blur(10px);
  }

  /* ── sidebar ── */
  .sidebar {
    background: #ffffff;
    border-left: 1px solid #e5e5ea;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  .sidebar-section {
    padding: 20px;
    border-bottom: 1px solid #f2f2f7;
  }

  .section-label {
    font-size: 10px; letter-spacing: 1.5px;
    color: #86868b; text-transform: uppercase;
    font-weight: 600; margin-bottom: 12px;
  }

  .alert-box {
    background: #f5f5f7;
    border: 1px solid #e5e5ea;
    border-radius: 12px;
    padding: 14px;
    display: flex; align-items: flex-start; gap: 10px;
    min-height: 60px;
    transition: background 0.3s;
  }
  .alert-box.danger {
    background: #fff5f5;
    border-color: #ffd0cc;
  }

  .alert-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }

  .alert-text {
    font-size: 13px; color: #86868b;
    line-height: 1.5; font-weight: 400;
  }
  .alert-text.active { color: #1d1d1f; font-weight: 500; }

  /* detections list */
  .det-header {
    padding: 16px 20px 4px;
    font-size: 10px; letter-spacing: 1.5px;
    color: #86868b; text-transform: uppercase;
    font-weight: 600;
  }

  .detections-list {
    flex: 1; overflow-y: auto;
    padding: 8px 20px 16px;
    display: flex; flex-direction: column; gap: 6px;
  }

  .detections-list::-webkit-scrollbar { width: 3px; }
  .detections-list::-webkit-scrollbar-thumb {
    background: #e5e5ea; border-radius: 3px;
  }

  .detection-item {
    display: flex; align-items: center;
    justify-content: space-between;
    background: #f9f9fb;
    border: 1px solid #ebebed;
    border-radius: 10px;
    padding: 9px 12px;
    animation: fadeIn 0.15s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(3px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .det-left { display: flex; align-items: center; gap: 8px; }

  .det-dot {
    width: 7px; height: 7px; border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-ahead  { background: #ff3b30; }
  .dot-left   { background: #ff9500; }
  .dot-right  { background: #34c759; }

  .det-name {
    font-size: 13px; font-weight: 500;
    color: #1d1d1f; text-transform: capitalize;
  }

  .det-conf {
    font-size: 11px; color: #aeaeb2;
  }

  .det-zone {
    font-size: 11px; padding: 2px 9px;
    border-radius: 20px; font-weight: 600;
    letter-spacing: 0.3px;
  }
  .zone-ahead { background: #fff0ee; color: #ff3b30; }
  .zone-left  { background: #fff8ed; color: #ff9500; }
  .zone-right { background: #edfff3; color: #34c759; }

  .empty-state {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px; color: #aeaeb2;
    font-size: 13px; padding: 32px 0;
    flex: 1;
  }
  .empty-icon { font-size: 28px; opacity: 0.4; }

  /* stats */
  .stats-row {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px; padding: 16px 20px;
    border-top: 1px solid #f2f2f7;
  }

  .stat-card {
    background: #f5f5f7;
    border: 1px solid #ebebed;
    border-radius: 10px; padding: 12px;
    text-align: center;
  }

  .stat-value {
    font-size: 22px; font-weight: 700;
    color: #1d1d1f; line-height: 1;
  }

  .stat-label {
    font-size: 10px; color: #86868b;
    text-transform: uppercase;
    letter-spacing: 1px; margin-top: 4px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">👁</div>
    <div>
      <h1>AIRA</h1>
      <span>Assistive Navigation</span>
    </div>
  </div>
  <div class="header-right">
    <div class="status-pill">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Stopped</span>
    </div>
    <button class="btn btn-start" id="btn-start" onclick="startScan()">▶ Start</button>
    <button class="btn btn-stop"  id="btn-stop"  onclick="stopScan()">■ Stop</button>
  </div>
</header>

<div class="main">
  <div class="feed-section">
    <div class="feed-placeholder" id="placeholder">
      <div class="icon">◎</div>
      <div>Press Start to begin scanning</div>
    </div>
    <img id="feed" src="" alt="Camera Feed" style="display:none;">
    <div class="obj-badge" id="obj-badge" style="display:none;">0 objects</div>
  </div>

  <div class="sidebar">
    <div class="sidebar-section">
      <div class="section-label">Navigation Alert</div>
      <div class="alert-box" id="alert-box">
        <div class="alert-icon">👁</div>
        <div class="alert-text" id="alert-text">Waiting to start...</div>
      </div>
    </div>

    <div class="det-header">Detections</div>
    <div class="detections-list" id="detections-list">
      <div class="empty-state">
        <div class="empty-icon">◎</div>
        No objects detected
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-value" id="total-count">0</div>
        <div class="stat-label">Objects</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="nearest-class">—</div>
        <div class="stat-label">Nearest</div>
      </div>
    </div>
  </div>
</div>

<script>
  const socket     = io();
  let isScanning   = false;

  // ── controls ──────────────────────────────────────────────────────────────
  async function startScan() {
    await fetch('/start', { method: 'POST' });
    isScanning = true;
    document.getElementById('feed').src = '/video_feed';
    document.getElementById('feed').style.display = 'block';
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('obj-badge').style.display = 'block';
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-stop').style.display  = 'inline-block';
    document.getElementById('status-dot').classList.add('active');
    document.getElementById('status-text').textContent = 'Live';
    document.getElementById('alert-text').textContent  = 'Scanning environment...';
    document.getElementById('alert-text').classList.remove('active');
  }

  async function stopScan() {
    await fetch('/stop', { method: 'POST' });
    isScanning = false;
    document.getElementById('feed').style.display = 'none';
    document.getElementById('placeholder').style.display = 'flex';
    document.getElementById('obj-badge').style.display = 'none';
    document.getElementById('btn-start').style.display  = 'inline-block';
    document.getElementById('btn-stop').style.display   = 'none';
    document.getElementById('status-dot').classList.remove('active');
    document.getElementById('status-text').textContent  = 'Stopped';
    document.getElementById('alert-text').textContent   = 'Waiting to start...';
    document.getElementById('alert-text').classList.remove('active');
    document.getElementById('detections-list').innerHTML =
      `<div class="empty-state"><div class="empty-icon">◎</div>No objects detected</div>`;
    document.getElementById('total-count').textContent  = '0';
    document.getElementById('nearest-class').textContent = '—';
    document.getElementById('obj-badge').textContent = '0 objects';
  }

  // ── socket ────────────────────────────────────────────────────────────────
  socket.on('detections', (data) => {
    if (!isScanning) return;
    const objects = data.objects || [];

    document.getElementById('total-count').textContent = objects.length;
    document.getElementById('obj-badge').textContent   =
      objects.length + ' object' + (objects.length !== 1 ? 's' : '');

    const alertBox  = document.getElementById('alert-box');
    const alertText = document.getElementById('alert-text');

    if (objects.length === 0) {
      alertBox.classList.remove('danger');
      alertText.textContent = 'Path is clear';
      alertText.classList.remove('active');
      document.getElementById('detections-list').innerHTML =
        `<div class="empty-state"><div class="empty-icon">◎</div>No objects detected</div>`;
      document.getElementById('nearest-class').textContent = '—';
      return;
    }

    const ahead = objects.filter(o => o.zone === 'ahead');
    if (ahead.length > 0) {
      const names = [...new Set(ahead.map(o => o.class))].join(', ');
      alertText.textContent = ahead.length > 1
        ? `${ahead.length} objects ahead — ${names}`
        : `${ahead[0].class} directly ahead`;
      alertBox.classList.add('danger');
    } else {
      alertText.textContent = `${objects.length} object${objects.length > 1 ? 's' : ''} nearby`;
      alertBox.classList.remove('danger');
    }
    alertText.classList.add('active');

    document.getElementById('nearest-class').textContent =
      (ahead[0] || objects[0]).class;

    document.getElementById('detections-list').innerHTML = objects.map(o => `
      <div class="detection-item">
        <div class="det-left">
          <div class="det-dot dot-${o.zone}"></div>
          <span class="det-name">${o.class}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="det-conf">${Math.round(o.confidence * 100)}%</span>
          <span class="det-zone zone-${o.zone}">${o.zone}</span>
        </div>
      </div>
    `).join('');
  });
</script>
</body>
</html>
